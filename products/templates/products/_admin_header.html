<header class="site-header admin-header">
  <div class="header-inner admin-header-inner">
    <button class="admin-menu-toggle" id="adminMenuToggle" aria-label="Abrir menú" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div>
      <h1 class="admin-header-title">
        {{ admin_header_title|default:"Imágenes" }}
      </h1>
      <div class="admin-header-subtitle">
        {{ admin_header_subtitle|default:"Panel de administración de imágenes" }}
      </div>
    </div>
    <div class="admin-header-right">
      {% if request.GET.view == 'all' or request.GET.folder %}
      <a class="admin-header-btn" href="{% url 'gallery:image_list' %}">
        <i class="fa-solid fa-house"></i>
        <span>Raíz</span>
      </a>
      {% endif %}

      <a class="admin-header-btn" href="{% url 'products:product_list' %}" target="_blank" rel="noopener">
        <i class="fa-solid fa-store"></i>
        <span>Ver tienda</span>
      </a>

      <a class="admin-header-btn" href="{% url 'home:index' %}" target="_blank" rel="noopener">
        <i class="fa-solid fa-globe"></i>
        <span>Sitio</span>
      </a>
    </div>
  </div>
</header>
