{% load static product_extras %}
<article class="bento-item bento-item--tall-image {% if product.is_new %}bento-item--new{% endif %}" style="grid-column: span 1; grid-row: span 2;">
  <div class="bento-cell">
    <img class="bento-media" src="{{ product.get_image_url }}" alt="{{ product.name }}" loading="lazy" fetchpriority="high">
    <div class="product-badges">
      <span class="badge badge-type">{{ product.get_jewelry_type_display }}</span>
      <span class="badge badge-material">{{ product.get_material_display }}</span>
    </div>
    <span class="bento-size-badge" aria-label="Tamaño bento {{ product.bento_size|bento_label }}">{{ product.bento_size|bento_label }}</span>
  </div>
</article>
