<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{% url 'home:index' %}">Miluxious<span>accesorios</span></a>
    <nav class="nav-main">
      <a href="{% url 'home:index' %}"><span class="nav-text">Inicio</span><i class="fas fa-house nav-icon"></i></a>
      <a href="{% url 'home:reel' %}"><span class="nav-text">Reel</span><i class="fas fa-film nav-icon"></i></a>
      <a href="{% url 'partners:list' %}"><span class="nav-text">Tiendas</span><i class="fas fa-shop nav-icon"></i></a>
      <a href="{% url 'products:product_list' %}"><span class="nav-text">Catálogo</span><i class="fas fa-store nav-icon"></i></a>
    </nav>
    <div class="header-actions">
      {% if user.is_authenticated %}
        {% if user.is_staff or user.is_superuser %}
        <a href="{% url 'gallery:home' %}" title="Panel de administración">
          <span class="nav-text">Admin</span><i class="fas fa-grip nav-icon"></i>
        </a>
        {% endif %}
        <a href="{% url 'accounts:profile' %}"><span class="nav-text">Perfil</span><i class="fas fa-user nav-icon"></i></a>
        <a href="{% url 'accounts:logout' %}"><span class="nav-text">Salir</span><i class="fas fa-right-from-bracket nav-icon"></i></a>
      {% else %}
        <a href="{% url 'accounts:login' %}"><span class="nav-text">Ingresar</span><i class="fas fa-right-to-bracket nav-icon"></i></a>
      {% endif %}
      <a href="{% url 'cart:cart_detail' %}" class="cart-badge" aria-label="Carrito">
        <i class="fas fa-cart-shopping"></i>
        <span class="cart-counter">{{ cart.total_items|default:0 }}</span>
      </a>
    </div>
  </div>
</header>
