<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{% url 'home:index' %}">Miluxious accesorios</a>
    <nav class="nav-main">
      <a href="{% url 'home:index' %}">Inicio</a>
      <a href="{% url 'products:product_list' %}">Catálogo</a>
      <a href="{% url 'products:product_list' %}?category=compromiso">Compromiso</a>
      <a href="{% url 'products:product_list' %}?category=regalos">Regalos</a>
      <a href="#" class="pill">Tiendas</a>
    </nav>
    <div class="header-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}">Perfil</a>
        <a href="{% url 'accounts:logout' %}">Salir</a>
      {% else %}
        <a href="{% url 'accounts:login' %}">Ingresar</a>
      {% endif %}
      <a href="{% url 'cart:cart_detail' %}" class="cart-badge">{{ cart_items_count|default:0 }}</a>
    </div>
  </div>
</header>
