<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{% url 'home:index' %}">Miluxious<span>accesorios</span></a>
    <nav class="nav-main">
      <a href="{% url 'home:index' %}">Inicio</a>
      <a href="{% url 'products:product_list' %}">Catálogo</a>
      <a href="{% url 'products:product_list' %}?category=compromiso">Compromiso</a>
      <a href="{% url 'products:product_list' %}?category=regalos">Regalos</a>
    </nav>
    <div class="header-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}">Perfil</a>
        <a href="{% url 'accounts:logout' %}">Salir</a>
      {% else %}
        <a href="{% url 'accounts:login' %}">Ingresar</a>
      {% endif %}
      <a href="{% url 'cart:cart_detail' %}" class="cart-badge">
        <i class="fas fa-cart-shopping"></i>
        <span>{{ cart.total_items|default:0 }}</span>
      </a>
    </div>
  </div>
</header>
