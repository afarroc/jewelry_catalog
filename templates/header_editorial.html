<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{% url 'home:index' %}">Miluxious<span>accesorios</span></a>
    <nav class="nav-main">
      <a href="{% url 'home:index' %}" aria-label="Inicio"><i class="fas fa-house"></i></a>
      <a href="{% url 'products:product_list' %}" aria-label="Catálogo"><i class="fas fa-store"></i></a>
      <a href="{% url 'products:product_list' %}?category=compromiso" aria-label="Compromiso"><i class="fas fa-gem"></i></a>
      <a href="{% url 'products:product_list' %}?category=regalos" aria-label="Regalos"><i class="fas fa-gift"></i></a>
    </nav>
    <div class="header-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}" aria-label="Perfil"><i class="fas fa-user"></i></a>
        <a href="{% url 'accounts:logout' %}" aria-label="Salir"><i class="fas fa-right-from-bracket"></i></a>
      {% else %}
        <a href="{% url 'accounts:login' %}" aria-label="Ingresar"><i class="fas fa-right-to-bracket"></i></a>
      {% endif %}
      <a href="{% url 'cart:cart_detail' %}" class="cart-badge" aria-label="Carrito">
        <i class="fas fa-cart-shopping"></i>
        <span class="cart-counter">{{ cart.total_items|default:0 }}</span>
      </a>
    </div>
  </div>
</header>
