{% load static %}
<article class="product-card">
  <a href="{% url 'products:product_detail' product.slug %}" class="text-decoration-none">
    <div class="product-media">
      {% if product.image %}
        <img src="{{ product.get_image_url }}" alt="{{ product.name }}">
      {% else %}
        <div style="width: 100%; height: 100%; background: #e6e0d8; display: flex; align-items: center; justify-content: center;">
          <i class="fas fa-image" style="color: #8c8a86; font-size: 24px;"></i>
        </div>
      {% endif %}
    </div>
    <div class="product-info">
      {% if product.category %}
        <p class="product-category">{{ product.category.name }}</p>
      {% endif %}
      <h3 class="product-title">{{ product.name }}</h3>
      {% if product.description %}
        <p class="product-desc">{{ product.description|truncatechars:100 }}</p>
      {% endif %}
      <p class="product-price">{{ product.display_price }}</p>
    </div>
  </a>
</article>
